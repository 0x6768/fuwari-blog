<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>站点访问统计</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #fefefe; color: #333; line-height: 1.5;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px;
        }
        .container { width: 100%; max-width: 600px; } /* 稍微加宽一点 */
        .stats-box {
            background: #fff; border-radius: 8px; padding: 40px 30px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04); border: 1px solid #f0f0f0;
        }
        .title { text-align: center; font-size: 1.1rem; color: #666; margin-bottom: 30px; }
        
        /* 新的行样式 */
        .stats-comparison-row {
            padding: 20px 0;
            border-bottom: 1px solid #f5f5f5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stats-comparison-row:last-child { border-bottom: none; }
        
        .metric-label {
            font-size: 1.1rem;
            font-weight: 500;
            color: #222;
            min-width: 100px; /* 保持标签宽度一致 */
        }
        
        .comparison-container {
            display: flex;
            gap: 30px; /* 两组数据之间的间距 */
            flex: 1;
            justify-content: flex-end;
        }
        
        .stat-group {
            text-align: center;
            min-width: 120px;
        }
        
        .source-label {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 6px;
            display: block;
        }
        
        .stat-value {
            font-size: 1.3rem;
            font-weight: 600;
            color: #1890ff; /* 主色 */
            font-variant-numeric: tabular-nums;
        }
        
        .stat-value.bsz { color: #1890ff; } /* 不蒜子用蓝色 */
        .stat-value.umami { color: #52c41a; } /* Umami用绿色 */
        
        .stat-value.error { color: #ff4d4f; }
        
        .footer { text-align: center; margin-top: 30px; font-size: 0.85rem; color: #aaa; }
        
        @media (max-width: 480px) {
            .stats-box { padding: 30px 20px; }
            .comparison-container { gap: 15px; flex-direction: column; }
            .stat-group { min-width: auto; }
            .metric-label { margin-bottom: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="stats-box">
            <div class="title">访问统计</div>
            
            <!-- 总访问量（PV）对比行 -->
            <div class="stats-comparison-row">
                <div class="metric-label">总访问量</div>
                <div class="comparison-container">
                    <div class="stat-group">
                        <span class="source-label">不蒜子</span>
                        <span class="stat-value loading bsz" id="busuanzi_site_pv">--</span>
                    </div>
                    <div class="stat-group">
                        <span class="source-label">Umami</span>
                        <span class="stat-value loading umami" id="umami_site_pv">--</span>
                    </div>
                </div>
            </div>
            
            <!-- 总访客数（UV）对比行 -->
            <div class="stats-comparison-row">
                <div class="metric-label">总访客数</div>
                <div class="comparison-container">
                    <div class="stat-group">
                        <span class="source-label">不蒜子</span>
                        <span class="stat-value loading bsz" id="busuanzi_site_uv">--</span>
                    </div>
                    <div class="stat-group">
                        <span class="source-label">Umami</span>
                        <span class="stat-value loading umami" id="umami_site_uv">--</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 原有脚本保持不变 -->
    <script defer src="https://jsd.onmicrosoft.cn/npm/penndu@17.0.0/bsz.js"></script>
    <script src="http://jsd.onmicrosoft.cn/gh/0x6768/web/umami.min.js" 
            data-umami-baseurl="https://hm.7003410.xyz" 
            data-umami-share-id="dV8cZEmYB2VXKyJs"></script>
</body>
</html>
